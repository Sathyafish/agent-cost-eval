[project]
name = "agent-cost-eval"
version = "0.1.0"
description = "Coarse vs granular Langfuse tracing for the same LangGraph agent, on Ollama"
requires-python = ">=3.11"
dependencies = [
  "langchain-ollama",
  "langchain",
  "langchain-core",
  "langgraph",
  "langfuse>=3,<4",
  "python-dotenv",
  "requests",
  "fastapi",
  "uvicorn",
]

[dependency-groups]
dev = ["pytest", "responses", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cost_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs live Ollama and Langfuse"]
addopts = "-m 'not integration'"
